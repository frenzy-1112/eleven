name: Kernel Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    name: Build Escrima Kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
    - name: 🧾 Checkout Kernel Source
      uses: actions/checkout@v4

    - name: ⚙️ Install Required Packages
      run: |
        sudo apt update
        sudo apt install -y \
          git zip curl wget \
          gcc g++ clang \
          libssl-dev bc bison flex \
          libelf-dev libncurses5-dev \
          libxml2-utils software-properties-common \
          libstdc++-11-dev

    - name: 🐍 Manually Install Python2 (Legacy)
      run: |
        sudo add-apt-repository ppa:deadsnakes/ppa -y
        sudo apt update
        sudo apt install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 🧪 Prepare Workspace
      run: |
        mkdir -p $HOME/scripts/ufdt/libufdt
        mkdir -p $HOME/clang-llvm
        mkdir -p out

    - name: 🏗️ Build Kernel
      run: |
        chmod +x build.sh
        ./build.sh

    - name: 📦 Upload Flashable Zip
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Escrima-Kernel-${{ github.ref_name }}
        path: AnyKernel3/*.zip

    - name: 📄 Upload build.log on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ github.run_id }}
        path: build.log
