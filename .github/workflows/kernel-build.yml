name: Kernel Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04  # LTS, stable, compatible with older tooling
    timeout-minutes: 120

    steps:
    - name: 📥 Checkout Kernel Source
      uses: actions/checkout@v4

    - name: 🧰 Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc bison build-essential ccache curl flex git libssl-dev \
          libncurses5-dev libncursesw5-dev libelf-dev \
          python3 unzip wget xz-utils zip \
          zstd libxml2-utils rsync lz4 \
          device-tree-compiler software-properties-common

    - name: 🐍 Manually Install Python2 (Legacy)
      run: |
        sudo add-apt-repository ppa:deadsnakes/ppa -y
        sudo apt-get update
        sudo apt-get install -y python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: 🧪 Prepare Paths and Workspace
      run: |
        mkdir -p $HOME/scripts/ufdt/libufdt
        mkdir -p $HOME/clang-llvm
        mkdir -p AnyKernel3
        mkdir -p output

    - name: 🔧 Build Kernel using build.sh
      run: |
        bash build.sh

    - name: 📤 Upload Flashable Kernel Zip
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Escrima-Kernel
        path: AnyKernel3/*.zip
